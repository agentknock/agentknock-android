[versions]
activity-compose = "1.13.0"
adaptive = "1.3.0"
agp = "9.3.1"
bouncycastle = "1.85.2"
biometric = "1.1.0"
compose-bom = "2026.08.00"
coroutines = "1.11.0"
espresso = "3.7.0"
firebase-bom = "34.17.0"
fragment = "1.9.0"
google-services = "4.5.0"
junit = "4.13.2"
