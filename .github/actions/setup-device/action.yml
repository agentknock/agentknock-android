name: Set up Android device tests
description: Install one emulator image and enable hardware acceleration.
inputs:
  api:
    description: Android API level to test.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Install emulator and image
      shell: bash
      env:
        API: ${{ inputs.api }}
      run: |
        case "$API" in
          26) image='system-images;android-26;google_apis;x86_64' ;;
          37) image='system-images;android-37.0;google_apis;x86_64' ;;
          *) echo "Unsupported CI API: $API" >&2; exit 1 ;;
        esac
        # This project has no NDK code; reclaim its space for the emulator image.
        sudo rm --recursive --force "${ANDROID_HOME:?}/ndk"
        sdkmanager "$image" emulator platform-tools 'build-tools;36.0.0'
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        echo "AGENTKNOCK_EMULATOR_API=$API" >> "$GITHUB_ENV"
        echo "AGENTKNOCK_EMULATOR_IMAGE=$image" >> "$GITHUB_ENV"
        df --human-readable /

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
