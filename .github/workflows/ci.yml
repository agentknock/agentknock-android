name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: repository
      - name: Install actionlint
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "$tool_dir/actionlint.tar.gz" --directory "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Check formatting, scripts, workflows, and FOSS dependencies
        run: scripts/check-repository

  distribution:
    name: ${{ matrix.distribution }}
    strategy:
      fail-fast: false
      matrix:
        distribution: [foss, play]
    uses: ./.github/workflows/ci-distribution.yml
    with:
      distribution: ${{ matrix.distribution }}

  complete:
    name: CI passed
    if: always()
    needs: [repository, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failures:
              raise SystemExit(f"CI did not pass: {failures}")
          PY
