name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR commits and version code
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/version.py check --head "$PR_HEAD"
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: repository
      - name: Install actionlint
        run: |
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "$tool_dir/actionlint.tar.gz" --directory "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Check formatting, scripts, workflows, and FOSS dependencies
        run: scripts/check-repository

  distribution:
    name: ${{ matrix.distribution }}
    strategy:
      fail-fast: false
      matrix:
        distribution: [foss, play]
    uses: ./.github/workflows/ci-distribution.yml
    with:
      distribution: ${{ matrix.distribution }}

  signing-check:
    name: Signing tool checks
    needs: distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-signing
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          path: unsigned-release
      - name: Exercise APK and AAB signing with a disposable key
        run: python3 scripts/check-signing.py

  complete:
    name: CI passed
    if: always()
    needs: [repository, distribution, signing-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failures:
              raise SystemExit(f"CI did not pass: {failures}")
          PY

  signing:
    name: Sign release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: complete
    uses: ./.github/workflows/sign-release.yml
    permissions:
      contents: read
      artifact-metadata: write
      attestations: write
      id-token: write

  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: release-please-master
      queue: max
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create draft releases and update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: master
      - name: Bump the release PR version code and run CI
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: python3 scripts/bump-release-pr.py

  publish-play:
    name: Publish Google Play build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: signing
    uses: ./.github/workflows/publish-play.yml
    permissions:
      contents: read
      attestations: read
      id-token: write

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [signing, release-please]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: github-release-master
      queue: max
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: release-assets
      - name: Attach verified assets and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-github-release.py
