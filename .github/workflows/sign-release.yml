name: Sign release artifacts

on:
  workflow_call:

permissions:
  contents: read
  artifact-metadata: write
  attestations: write
  id-token: write

jobs:
  sign:
    name: Sign with Google Cloud HSM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require cloud signing configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SIGNING_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNING_SERVICE_ACCOUNT }}
          GCP_SIGNING_KEY_VERSION: ${{ vars.GCP_SIGNING_KEY_VERSION }}
          GCP_PLAY_UPLOAD_KEY_VERSION: ${{ vars.GCP_PLAY_UPLOAD_KEY_VERSION }}
        run: |
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the workload identity provider}"
          : "${GCP_SIGNING_SERVICE_ACCOUNT:?Set the signing service account}"
          : "${GCP_SIGNING_KEY_VERSION:?Set the imported signing key version}"
          : "${GCP_PLAY_UPLOAD_KEY_VERSION:?Set the imported Play upload key version}"
      - uses: ./.github/actions/setup-signing
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          path: unsigned-release
      - name: Authenticate to Google Cloud through GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Sign and verify the tested APKs and bundle
        env:
          GCP_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GCP_SIGNING_KEY_VERSION: ${{ vars.GCP_SIGNING_KEY_VERSION }}
          GCP_PLAY_UPLOAD_KEY_VERSION: ${{ vars.GCP_PLAY_UPLOAD_KEY_VERSION }}
        run: python3 scripts/sign-release.py
      - name: Attest signed artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Include the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" release-assets/provenance.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
