name: Sign release artifacts

on:
  workflow_call:

permissions:
  contents: read
  artifact-metadata: write
  attestations: write
  id-token: write

jobs:
  sign:
    name: Sign with a temporary test key
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: signing
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          path: unsigned-release
      - name: Sign and verify the tested APK and bundle
        run: scripts/sign-test-release
      - name: Attest signed artifacts
        if: github.event_name == 'push'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Include the attestation bundle
        if: github.event_name == 'push'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" release-assets/provenance.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-signed-release
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
