name: Publish Google Play build

on:
  workflow_call:
    inputs:
      release-tag:
        description: Published GitHub release to promote to Alpha; empty uploads this build internally
        type: string
        default: ''

permissions:
  contents: read
  attestations: read
  id-token: write

jobs:
  publish:
    name: ${{ inputs.release-tag != '' && 'Promote release to Alpha' || 'Publish to internal track' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: google-play-publishing
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require Play publishing configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PLAY_PUBLISHING_SERVICE_ACCOUNT: ${{ vars.GCP_PLAY_PUBLISHING_SERVICE_ACCOUNT }}
        run: |
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set the workload identity provider}"
          : "${GCP_PLAY_PUBLISHING_SERVICE_ACCOUNT:?Set the Play publishing service account}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.release-tag == ''
        with:
          name: signed-release
          path: release-assets
      - name: Authenticate to Google Play through GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_PUBLISHING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify and publish the signed bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCP_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/publish-play.py
