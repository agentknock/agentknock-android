name: Distribution checks

on:
  workflow_call:
    inputs:
      distribution:
        description: App distribution to build and test.
        required: true
        type: string

permissions:
  contents: read

env:
  DISTRIBUTION: ${{ inputs.distribution }}
  GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.workers.max=2

jobs:
  unit:
    name: JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-unit
      - name: Run JVM tests
        run: ./gradlew ":app:test${DISTRIBUTION^}DebugUnitTest"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-unit-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-lint
      - name: Lint debug and release
        run: ./gradlew ":app:lint${DISTRIBUTION^}Debug" ":app:lint${DISTRIBUTION^}Release"
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-lint-reports
          path: app/build/reports/lint-results-*
          retention-days: 7

  previews:
    name: Screen previews
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-previews
      - name: Install preview image support
        run: python3 -m pip install Pillow==12.3.0
      - name: Render all screen variants
        run: ./preview-ui --distribution "$DISTRIBUTION"
      - name: Upload previews and render reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-previews
          path: |
            app/build/reports/ui-previews/
            app/build/reports/screenshotTests/
            app/build/test-results/
          retention-days: 7

  debug:
    name: Debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-debug
      - name: Build app and instrumentation APKs
        run: ./gradlew ":app:assemble${DISTRIBUTION^}Debug" ":app:assemble${DISTRIBUTION^}DebugAndroidTest"
      - name: Check Room schema exports
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- app/schemas)" ]]; then
            echo 'Room schema exports changed; commit the schema and its migration.' >&2
            git status --short -- app/schemas
            exit 1
          fi
      - name: Upload APKs for instrumentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-debug-apks
          path: |
            app/build/outputs/apk/${{ inputs.distribution }}/debug/*.apk
            app/build/outputs/apk/androidTest/${{ inputs.distribution }}/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Minified release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGENTKNOCK_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-release
      - uses: ./.github/actions/setup-bundletool
        if: inputs.distribution == 'play'
      - name: Build unsigned release
        run: |
          case "$DISTRIBUTION" in
            foss) ./gradlew :app:assembleFossRelease ;;
            play) ./gradlew :app:bundlePlayRelease :app:generatePlayReleasePlayResources ;;
            *) echo "Unknown distribution: $DISTRIBUTION" >&2; exit 1 ;;
          esac
      - name: Validate release artifact
        run: python3 scripts/check-release.py "$DISTRIBUTION"
      - name: Upload release for startup checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-release
          path: |
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/
          if-no-files-found: error
          retention-days: 3
      - name: Upload release validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-release-reports
          path: app/build/reports/release-check/
          retention-days: 7

  instrumentation:
    name: Instrumentation (API ${{ matrix.api }})
    needs: debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 37]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-device
        with:
          api: ${{ matrix.api }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.distribution }}-debug-apks
          path: app/build/outputs/apk
      - name: Run instrumentation
        run: scripts/check-device "$DISTRIBUTION" instrumentation
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-instrumentation-api-${{ matrix.api }}
          path: app/build/reports/device-checks/
          retention-days: 7

  startup:
    name: Release startup (API ${{ matrix.api }})
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 37]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-device
        with:
          api: ${{ matrix.api }}
      - uses: ./.github/actions/setup-bundletool
        if: inputs.distribution == 'play'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.distribution }}-release
          path: app/build/outputs
      - name: Check minified release startup
        run: scripts/check-device "$DISTRIBUTION" release
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-startup-api-${{ matrix.api }}
          path: app/build/reports/device-checks/
          retention-days: 7
