name: Distribution checks

on:
  workflow_call:
    inputs:
      distribution:
        description: App distribution to build and test.
        required: true
        type: string

permissions:
  contents: read

env:
  DISTRIBUTION: ${{ inputs.distribution }}
  GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.workers.max=2

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-lint
      - name: Lint app and test sources
        run: ./gradlew ":app:lint${DISTRIBUTION^}Debug"

  debug:
    name: Debug build and JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-debug
      - name: Build APKs, run JVM tests, and compile previews
        run: |
          ./gradlew ":app:assemble${DISTRIBUTION^}Debug" \
            ":app:assemble${DISTRIBUTION^}DebugAndroidTest" \
            ":app:test${DISTRIBUTION^}DebugUnitTest" \
            ":app:compile${DISTRIBUTION^}DebugScreenshotTestSources"
      - name: Check Room schema exports
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- app/schemas)" ]]; then
            echo 'Room schema exports changed; commit the schema and its migration.' >&2
            git status --short -- app/schemas
            exit 1
          fi
      - name: Upload APKs for instrumentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-debug-apks
          path: |
            app/build/outputs/apk/${{ inputs.distribution }}/debug/*.apk
            app/build/outputs/apk/androidTest/${{ inputs.distribution }}/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Minified release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-scope: ${{ inputs.distribution }}-release
      - uses: ./.github/actions/setup-bundletool
        if: inputs.distribution == 'play'
      - name: Build unsigned release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            export AGENTKNOCK_SOURCE_REVISION="$GITHUB_SHA"
            echo "AGENTKNOCK_SOURCE_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
          case "$DISTRIBUTION" in
            foss) ./gradlew :app:assembleFossRelease ;;
            play) ./gradlew :app:assemblePlayRelease :app:bundlePlayRelease :app:generatePlayReleasePlayResources ;;
            *) echo "Unknown distribution: $DISTRIBUTION" >&2; exit 1 ;;
          esac
      - name: Validate release artifact
        run: python3 scripts/check-release.py "$DISTRIBUTION"
      - name: Upload release for startup checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.distribution }}-release
          path: |
            app/build/outputs/apk/${{ inputs.distribution }}/release/*.apk
            app/build/outputs/bundle/${{ inputs.distribution }}Release/*.aab
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}

  instrumentation:
    name: Instrumentation (API ${{ matrix.api }})
    needs: debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 37]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-device
        with:
          api: ${{ matrix.api }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.distribution }}-debug-apks
          path: app/build/outputs/apk
      - name: Run instrumentation
        run: scripts/check-device "$DISTRIBUTION" instrumentation

  startup:
    name: Release startup (API ${{ matrix.api }})
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 37]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-device
        with:
          api: ${{ matrix.api }}
      - uses: ./.github/actions/setup-bundletool
        if: inputs.distribution == 'play'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.distribution }}-release
          path: app/build/outputs
      - name: Check minified release startup
        run: scripts/check-device "$DISTRIBUTION" release
